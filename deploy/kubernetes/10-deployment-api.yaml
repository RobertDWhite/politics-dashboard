apiVersion: apps/v1
kind: Deployment
metadata:
  name: politics-api
  labels: { app: politics-api }
spec:
  replicas: 1
  selector:
    matchLabels: { app: politics-api }
  template:
    metadata:
      labels: { app: politics-api }
    spec:
      containers:
        - name: api
          image: ghcr.io/your-org/politics-api
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: CONFIG_PATH
              value: /etc/politics/config.yaml
          envFrom:
            - secretRef:
                name: politics-secrets
          volumeMounts:
            - name: config
              mountPath: /etc/politics
              readOnly: true
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 30
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 512Mi }
      volumes:
        - name: config
          configMap:
            name: politics-config
