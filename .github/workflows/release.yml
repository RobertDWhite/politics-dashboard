name: release

# Build and publish multi-arch images to GHCR.
#
# Triggers:
#   - Push to main         → :main and :sha-<short> tags
#   - Tag push (v*)        → :2.0.0, :2.0, :2, :latest tags
#   - Manual dispatch      → :manual-<run> tag, useful for one-offs
#
# Resulting images:
#   ghcr.io/robertdwhite/politics-api
#   ghcr.io/robertdwhite/politics-ui

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component:
          - name: api
            context: ./api
          - name: ui
            context: ./ui
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/robertdwhite/politics-${{ matrix.component.name }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component.name }}
          # The UI iframe URL for Nitter is a build-time Vite var. It's left
          # empty in the published image so the Twitter panel renders blank
          # tabs unless the user disables Twitter in their config.yaml or
          # rebuilds the UI with their own VITE_NITTER_EMBED_BASE.
