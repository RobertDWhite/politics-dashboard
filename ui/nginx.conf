server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Re-resolve the API hostname every 10s so DNS changes (rolling restart,
    # kube-dns rotation) don't pin nginx to a stale IP at startup.
    resolver 127.0.0.11 8.8.8.8 valid=10s ipv6=off;

    location /api/ {
        # API_UPSTREAM defaults to the docker-compose service name "api".
        # Override at deploy time by mounting a different nginx.conf, e.g.
        # http://politics-api.politics.svc.cluster.local:8000 in Kubernetes.
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
